name: Build deb package

# Ez a workflow automatikusan lefut, ha main vagy dev ágra push történik.
# Kézzel is indítható a GitHub Actions felületéről a workflow_dispatch miatt.
#
# A tényleges csomagolási logika a packaging/build_deb.sh szkriptben van,
# hogy a build-deb.yml és a publish-apt-repo.yml ugyanazt a logikát használja.

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  build-deb:
    name: Build Debian package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make build script executable
        run: |
          chmod +x packaging/build_deb.sh

      - name: Build deb package
        run: |
          ./packaging/build_deb.sh

      # Az elkészült .deb fájl feltöltése GitHub Actions artifactként.
      # Ez kézi letöltéshez jó, de nem maga az APT szoftverforrás.
      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: retro-game-launcher-deb
          path: build/*.deb
