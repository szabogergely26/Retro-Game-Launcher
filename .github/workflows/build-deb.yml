name: Build deb package

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  build-deb:
    name: Build Debian package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare package directory
        run: |
          set -e

          PACKAGE_NAME="retro-game-launcher"
          VERSION="0.1.0"
          BUILD_DIR="build/${PACKAGE_NAME}_${VERSION}_all"

          rm -rf build
          mkdir -p "${BUILD_DIR}/usr/share/${PACKAGE_NAME}"
          mkdir -p "${BUILD_DIR}/usr/bin"
          mkdir -p "${BUILD_DIR}/usr/share/applications"
          mkdir -p "${BUILD_DIR}/DEBIAN"

          cp -r apps "${BUILD_DIR}/usr/share/${PACKAGE_NAME}/"
          cp main.py "${BUILD_DIR}/usr/share/${PACKAGE_NAME}/"
          cp requirements.txt "${BUILD_DIR}/usr/share/${PACKAGE_NAME}/"

          if [ -d "icons" ]; then
            cp -r icons "${BUILD_DIR}/usr/share/${PACKAGE_NAME}/"
          fi

          cat > "${BUILD_DIR}/usr/bin/${PACKAGE_NAME}" << 'EOF'
          #!/bin/sh
          cd /usr/share/retro-game-launcher
          python3 main.py
          EOF

          chmod +x "${BUILD_DIR}/usr/bin/${PACKAGE_NAME}"

          cat > "${BUILD_DIR}/usr/share/applications/${PACKAGE_NAME}.desktop" << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Retro Game Launcher
          Comment=Egyszerű indítófelület DOSBox, Wine és natív Linux játékokhoz
          Exec=retro-game-launcher
          Terminal=false
          Categories=Game;
          EOF

          cat > "${BUILD_DIR}/DEBIAN/control" << EOF
          Package: ${PACKAGE_NAME}
          Version: ${VERSION}
          Section: games
          Priority: optional
          Architecture: all
          Depends: python3, python3-pyside6.qtwidgets
          Maintainer: Gergely Szabó
          Description: Retro Game Launcher
           Egyszerű indítófelület DOSBox, Wine és natív Linux játékokhoz.
          EOF

      - name: Build deb package
        run: |
          set -e

          PACKAGE_NAME="retro-game-launcher"
          VERSION="0.1.0"
          BUILD_DIR="build/${PACKAGE_NAME}_${VERSION}_all"

          dpkg-deb --build "${BUILD_DIR}"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: retro-game-launcher-deb
          path: build/*.deb
