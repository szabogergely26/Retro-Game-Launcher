name: Publish APT repository

# Ez a workflow csak main ágra push esetén fut le automatikusan.
# Feladata:
# - .deb csomag építése (packaging/build_deb.sh)
# - minimál APT repository struktúra létrehozása
# - GitHub Pages-re publikálás
#
# Ez teszi lehetővé, hogy a program később így frissüljön:
# sudo apt update
# sudo apt upgrade

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish-apt-repo:
    name: Build and publish APT repository
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install repository tools
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils

      - name: Import GPG signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -e
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG

      - name: Make build script executable
        run: |
          chmod +x packaging/build_deb.sh

      - name: Build deb package
        run: |
          ./packaging/build_deb.sh

      # Minimál APT repository struktúra létrehozása.
      #
      # A repo végül így néz ki:
      # repo/
      # ├── pool/main/retro-game-launcher.deb
      # └── dists/stable/main/binary-amd64/Packages(.gz)
      - name: Create APT repository structure
        run: |
          set -e

          mkdir -p repo/pool/main
          mkdir -p repo/dists/stable/main/binary-amd64

          cp build/*.deb repo/pool/main/

          cd repo

          dpkg-scanpackages pool /dev/null > dists/stable/main/binary-amd64/Packages
          gzip -k -f dists/stable/main/binary-amd64/Packages

          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="Retro Game Launcher" \
            -o APT::FTPArchive::Release::Label="Retro Game Launcher" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="amd64" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="APT repository for Retro Game Launcher" \
            release dists/stable > dists/stable/Release

          gpg --batch --yes \
            --local-user F68E5E281A6FDF11 \
            --clearsign \
            --output dists/stable/InRelease \
            dists/stable/Release

      - name: Create GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo

      # A csomaglista innen érhető el:
      # https://szabogergely26.github.io/Retro-Game-Launcher/dists/stable/main/binary-amd64/Packages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
